# Written by Foreman. Review it before you push it.
#
# One job per stack, with the cheap checks first so a failure shows up early.
# Make each job a required status check in branch protection, or nothing stops a merge.
#
# CodeQL runs on public repos. On a private repo it needs GitHub Advanced Security, so Semgrep runs there instead.
# If your private repo has Advanced Security, delete the `if` lines on the CodeQL and Semgrep steps.
name: 'Foreman CI'
'on':
  pull_request: null
permissions:
  contents: read
jobs:
  php:
    name: php
    runs-on: ubuntu-latest
    steps:
      -
        name: 'Check out'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      -
        name: 'Install dependencies'
        uses: ramsey/composer-install@v3
      -
        name: 'Prepare Laravel environment'
        run: |-
          cp .env.example .env
          php artisan key:generate
      -
        name: 'Formatter check'
        run: 'vendor/bin/pint --test'
      -
        name: 'Test integrity'
        working-directory: '${{ github.workspace }}'
        run: |-
          git show "origin/${{ github.base_ref }}:.github/foreman/test-integrity.php" > "$RUNNER_TEMP/test-integrity.php" || cp .github/foreman/test-integrity.php "$RUNNER_TEMP/test-integrity.php"
          php "$RUNNER_TEMP/test-integrity.php" --base=origin/${{ github.base_ref }}
      -
        name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: package-lock.json
      -
        name: 'Install Node dependencies'
        run: 'npm ci'
      -
        name: 'Build assets'
        run: 'npm run build'
      -
        name: Tests
        run: vendor/bin/phpunit
      -
        name: 'Composer audit'
        run: 'composer audit'
      -
        name: Semgrep
        run: 'pipx run semgrep scan --config p/php --config p/laravel --error'
  typescript:
    name: typescript
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      -
        name: 'Check out'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: 'Set up PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
      -
        name: 'Set up Node'
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: package-lock.json
      -
        name: 'Install dependencies'
        run: 'npm ci'
      -
        name: 'Test integrity'
        working-directory: '${{ github.workspace }}'
        run: |-
          git show "origin/${{ github.base_ref }}:.github/foreman/test-integrity.php" > "$RUNNER_TEMP/test-integrity.php" || cp .github/foreman/test-integrity.php "$RUNNER_TEMP/test-integrity.php"
          php "$RUNNER_TEMP/test-integrity.php" --base=origin/${{ github.base_ref }}
      -
        name: 'Dependency audit'
        run: 'npm audit'
      -
        name: 'CodeQL init'
        if: '${{ !github.event.repository.private }}'
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      -
        name: 'CodeQL analyze'
        if: '${{ !github.event.repository.private }}'
        uses: github/codeql-action/analyze@v3
      -
        name: Semgrep
        if: '${{ github.event.repository.private }}'
        run: 'pipx run semgrep scan --config p/typescript --config p/react --error'
